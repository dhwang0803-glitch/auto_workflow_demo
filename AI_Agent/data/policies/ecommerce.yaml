# Domain: e-commerce / online retail
# Format: each policy is a generic, parameterized condition+action pair that a
# typical team in this domain should declare. The gap_analyze service (W2-4b)
# reads this list, deterministically (extracted_skills empty) or via LLM
# coverage check (extracted_skills non-empty), and surfaces uncovered policies
# to the wizard. Each parameter carries a `prompt` that the wizard renders
# verbatim, plus a `default_baseline` the user can adopt with one click and a
# `baseline_source` the user sees as attribution. Policy-level `sources` link
# to industry references when they exist; `source_kind` honestly labels
# whether the policy is regulatory, industry-baseline (real external doc), or
# synthesized best-practice (LLM-derived patchwork).
domain: ecommerce
display_name: E-commerce / Online Retail
description: >
  Direct-to-consumer online stores selling physical or digital goods. Common
  workflow surfaces: order processing, returns, shipping notifications,
  abandoned-cart recovery, customer support triage, payment dispute handling.
policies:
  - id: ecommerce.refund_threshold
    name: Refund threshold escalation
    condition: >
      Customer requests a refund AND the original purchase amount exceeds the
      team's auto-approval limit AND the request occurs within the team's
      stated return window.
    action: >
      Do not auto-approve. Forward the request to the designated refund
      approver via the team's escalation channel with the customer email,
      original order id, refund amount, and reason. Wait for the approver's
      response before replying to the customer. If no response within the
      stated SLA, escalate to operations lead.
    rationale: >
      Large refunds materially affect monthly margin and require human
      judgement on goodwill vs precedent.
    parameters:
      - name: REFUND_AUTO_APPROVE_LIMIT
        prompt: "What dollar amount can you refund without manager approval?"
        default_baseline: "$50"
        baseline_source: "Synthesized — solo / small merchants typically auto-approve up to $50; mid-size stores raise to $100-$200 once they have margin headroom."
      - name: REFUND_APPROVER
        prompt: "Who approves refunds above that limit?"
        default_baseline: "Operations lead"
        baseline_source: "Synthesized — team-specific role."
      - name: ESCALATION_CHANNEL
        prompt: "Where does the approver get notified (Slack channel, email, ticket queue)?"
        default_baseline: "#refunds Slack channel"
        baseline_source: "Synthesized — most small teams route refund escalations through a single Slack channel."
      - name: RETURN_WINDOW_DAYS
        prompt: "How many days after delivery do you accept return requests?"
        default_baseline: "30 days"
        baseline_source: "NRF 2024 Returns Outlook — 30 days is the modal industry window for physical goods."
      - name: APPROVER_RESPONSE_SLA
        prompt: "How long should the approver have to respond before you escalate further?"
        default_baseline: "1 business day"
        baseline_source: "Synthesized — common operations SLA."
    sources:
      - title: "Stripe — Refunds"
        url: "https://stripe.com/docs/refunds"
      - title: "NRF Returns Outlook (2024)"
        url: "https://nrf.com/research"
    source_kind: industry-baseline
    tags: [refund, escalation, finance]

  - id: ecommerce.out_of_stock_handling
    name: Out-of-stock order handling
    condition: >
      An order is placed for a SKU that the inventory system reports as
      unavailable OR backordered with a lead time longer than the team's
      acceptable threshold.
    action: >
      Do not silently delay. Within the team's first-contact SLA, send the
      customer a notification with three options: wait for restock with
      estimated date, swap to a listed equivalent SKU, or cancel for full
      refund. Hold the payment authorization (do not capture) until the
      customer chooses.
    rationale: >
      Silent delays drive chargebacks and negative reviews. Early disclosure
      converts a problem into a controlled customer choice.
    parameters:
      - name: OOS_NOTIFY_SLA_HOURS
        prompt: "How quickly do you contact a customer after an out-of-stock order is detected?"
        default_baseline: "4 hours (business hours)"
        baseline_source: "Synthesized — industry support SLAs cluster around 4-8 hours for OOS notifications."
      - name: BACKORDER_LEAD_THRESHOLD_DAYS
        prompt: "Above how many days of expected delay do you treat a backorder as out-of-stock for the customer?"
        default_baseline: "7 days"
        baseline_source: "Synthesized — beyond a week most customers expect proactive contact rather than silent wait."
      - name: EQUIVALENT_SKU_POLICY
        prompt: "What's your rule for offering a swap SKU? (e.g. same brand only, same price band, never)"
        default_baseline: "Same product family, equal-or-lower price; flag if higher-priced swap"
        baseline_source: "Synthesized — protects margin while keeping the customer choice clean."
    sources: []
    source_kind: synthesized
    tags: [inventory, communication, fulfillment]

  - id: ecommerce.shipping_delay_proactive
    name: Proactive shipping delay communication
    condition: >
      A shipped order has not received a tracking scan within the carrier's
      expected first-scan window OR the projected delivery date has slipped
      past the original promise by more than the team's tolerance.
    action: >
      Send a proactive update from the support address before the customer
      asks. Include the new ETA, the reason if known, and a goodwill offer
      (free expedited shipping on next order, small store credit) if the slip
      exceeds the team's "significant delay" threshold.
    rationale: >
      Customers forgive carrier delays they hear about first; they punish
      carrier delays they discover by checking tracking themselves.
    parameters:
      - name: DELAY_TOLERANCE_DAYS
        prompt: "How many days late is 'late enough' to trigger a proactive notice?"
        default_baseline: "2 business days"
        baseline_source: "Synthesized — most carriers consider 2 business days slip the meaningful threshold."
      - name: SIGNIFICANT_DELAY_THRESHOLD_DAYS
        prompt: "How many days late counts as a 'significant' delay that earns a goodwill offer?"
        default_baseline: "5 business days"
        baseline_source: "Synthesized — beyond ~1 week customer goodwill needs active recovery."
      - name: GOODWILL_CREDIT_AMOUNT
        prompt: "How much store credit (or what perk) do you offer on a significant delay?"
        default_baseline: "$10 store credit OR free expedited next order"
        baseline_source: "Synthesized — small but acknowledged."
    sources: []
    source_kind: synthesized
    tags: [shipping, communication, retention]

  - id: ecommerce.damaged_lost_compensation
    name: Damaged or lost shipment compensation
    condition: >
      Customer reports an order arrived damaged with photo evidence, OR
      tracking shows delivered but customer reports non-receipt and the
      delivery occurred more than the carrier's investigation window ago.
    action: >
      For damaged with photo: issue replacement immediately at no cost; do
      not require return of the damaged item below a configurable value
      threshold. For lost: file the carrier claim AND issue replacement or
      refund within the team's SLA without waiting for the carrier outcome.
      The carrier reimbursement is a back-office concern, not the customer's.
    rationale: >
      Making the customer wait on carrier investigations destroys trust. The
      cost of a single replacement is far less than the lifetime value lost
      to a frustrated customer.
    parameters:
      - name: DAMAGE_NO_RETURN_THRESHOLD
        prompt: "Below what item value will you replace damaged items without requiring the customer to return them?"
        default_baseline: "$75"
        baseline_source: "Synthesized — return shipping + handling typically exceeds replacement cost below this band."
      - name: LOST_REPLACEMENT_SLA_HOURS
        prompt: "Once a lost shipment is confirmed, how fast do you replace or refund?"
        default_baseline: "24 hours"
        baseline_source: "Synthesized — same-day or next-business-day is the retention-positive bar."
      - name: CARRIER_INVESTIGATION_WINDOW_DAYS
        prompt: "How long after 'delivered' tracking do you treat a non-receipt claim as actionable (vs porch-pirate window)?"
        default_baseline: "3 days"
        baseline_source: "Synthesized — aligns with most major carrier investigation start windows."
    sources: []
    source_kind: synthesized
    tags: [fulfillment, customer-care, finance]

  - id: ecommerce.discount_abuse_detection
    name: Discount code abuse detection
    condition: >
      A discount code intended for a specific audience (newsletter, influencer,
      first-time buyer) is used in a pattern inconsistent with that intent —
      multiple uses from the same payment method, addresses, or device
      fingerprint exceeding the team's per-customer limit.
    action: >
      Do not block the order automatically — that creates support escalations
      from legitimate customers. Flag the order for review, hold fulfillment,
      and email the customer requesting clarification. If no satisfactory
      response within the team's hold window, cancel and refund.
    rationale: >
      Code abuse erodes margin on already-discounted orders. False positives
      on first-time buyers cost more than the abuse itself, so review beats
      block.
    parameters:
      - name: PER_CUSTOMER_USE_LIMIT
        prompt: "How many times can the same customer (payment method or address) use a single-use code before it's flagged?"
        default_baseline: "1 use"
        baseline_source: "Synthesized — first-time-buyer codes are single-use by intent."
      - name: REVIEW_HOLD_WINDOW_HOURS
        prompt: "After flagging an order for review, how long do you hold it before auto-cancelling?"
        default_baseline: "48 hours"
        baseline_source: "Synthesized — covers a full business day for legitimate customer reply."
      - name: DEVICE_MATCH_THRESHOLD
        prompt: "How aggressive is your device-fingerprint matching for abuse detection? (none / loose / strict)"
        default_baseline: "loose (IP + payment-method match only)"
        baseline_source: "Synthesized — strict device fingerprinting hits false positives on shared networks."
    sources: []
    source_kind: synthesized
    tags: [fraud, finance, marketing]

  - id: ecommerce.vip_customer_routing
    name: VIP customer support routing
    condition: >
      A support inquiry arrives from a customer whose lifetime spend, order
      count, or tier flag in the CRM exceeds the team's VIP threshold.
    action: >
      Bypass the standard ticket queue. Route to a named senior support agent
      or the team's VIP queue. First response SLA is the team's VIP-tier
      target, not the standard target. Include the customer's full purchase
      history in the ticket context for the agent.
    rationale: >
      VIP customers represent disproportionate revenue and attrition risk.
      Standard queue treatment for them is a strategic loss.
    parameters:
      - name: VIP_LIFETIME_SPEND_THRESHOLD
        prompt: "What lifetime customer spend qualifies as VIP for your store?"
        default_baseline: "$1,000 lifetime"
        baseline_source: "Synthesized — typical small-store cutoff; adjust by AOV and category."
      - name: VIP_FIRST_RESPONSE_SLA
        prompt: "How fast do you respond to a VIP support ticket?"
        default_baseline: "2 hours (business hours)"
        baseline_source: "Synthesized — distinct from standard tier (often 24h)."
      - name: VIP_QUEUE_OWNER
        prompt: "Who owns the VIP queue / who is the named contact?"
        default_baseline: "Lead support agent"
        baseline_source: "Synthesized — team-specific role."
    sources: []
    source_kind: synthesized
    tags: [support, retention, segmentation]

  - id: ecommerce.chargeback_response
    name: Chargeback dispute response
    condition: >
      The payment processor notifies of a chargeback or pre-arbitration on
      an order, regardless of dispute reason code.
    action: >
      Respond within the processor's deadline (do not let it lapse). Compile
      the standard evidence packet: order confirmation email, shipping proof
      (signature or scan), customer communication log, IP/device match. If
      the customer is reachable and the dispute looks like a misunderstanding
      (not fraud), call them once before submitting evidence — many disputes
      are withdrawn by the cardholder. Tag the customer record after outcome.
    rationale: >
      Lapsed chargebacks lose 100% of the disputed amount automatically. A
      direct customer call resolves a meaningful share of friendly-fraud
      cases at zero processing cost.
    parameters:
      - name: CHARGEBACK_RESPONSE_OWNER
        prompt: "Who is responsible for filing chargeback evidence packets?"
        default_baseline: "Operations lead"
        baseline_source: "Synthesized — team-specific role."
      - name: CUSTOMER_CALL_THRESHOLD
        prompt: "Above what dispute amount do you call the customer directly before submitting evidence?"
        default_baseline: "$50"
        baseline_source: "Stripe disputes guidance — direct contact is highest-leverage on small-to-mid disputes (most are withdrawn)."
      - name: EVIDENCE_PACKET_TEMPLATE
        prompt: "Where is your evidence-packet checklist or template stored?"
        default_baseline: "Shared drive: ops/chargeback_evidence.md"
        baseline_source: "Synthesized — template should live in the team's standard ops doc location."
    sources:
      - title: "Stripe — Disputes and chargebacks"
        url: "https://stripe.com/docs/disputes"
    source_kind: industry-baseline
    tags: [finance, fraud, communication]

  - id: ecommerce.negative_review_response
    name: Negative public review escalation
    condition: >
      A public review at or below the team's "negative" star threshold is
      posted on a monitored platform (own site, marketplace, or major review
      aggregator) AND the reviewer is identifiable to a specific order.
    action: >
      Do not respond defensively in public. Within the team's review-response
      SLA, post a public reply that acknowledges the issue without admitting
      fault on disputed facts, and offers to continue the conversation
      privately with a direct contact. Privately, contact the customer with
      a real resolution offer. Do not request review removal or modification
      as a condition of resolution.
    rationale: >
      Public defensive replies amplify damage. Private real resolution often
      converts the reviewer into a follow-up positive review or organic
      revision without being asked.
    parameters:
      - name: NEGATIVE_REVIEW_THRESHOLD_STARS
        prompt: "At or below what star rating do you treat a public review as 'negative' for escalation?"
        default_baseline: "3 stars (out of 5)"
        baseline_source: "Synthesized — 3★ is the conventional 'mediocre = at-risk' boundary."
      - name: REVIEW_RESPONSE_SLA_HOURS
        prompt: "How fast do you publicly respond to a flagged negative review?"
        default_baseline: "24 hours"
        baseline_source: "Synthesized — speed signals attentiveness to other readers."
      - name: REVIEW_RESPONSE_OWNER
        prompt: "Who drafts and posts the public response?"
        default_baseline: "Founder or operations lead"
        baseline_source: "Synthesized — public-facing tone usually owned by senior staff for small teams."
    sources: []
    source_kind: synthesized
    tags: [reputation, communication, retention]
