# Domain: service business (appointment-driven local/remote services)
# Format: see ecommerce.yaml header.
domain: services
display_name: Service Business (Appointment-driven)
description: >
  Small to medium service businesses that schedule appointments with
  customers — repair, cleaning, salon, healthcare, fitness, home services.
  Common workflow surfaces: booking and rescheduling, cancellation handling,
  customer intake, estimate or quote management, recurring rebooking,
  follow-up after service.
policies:
  - id: services.after_hours_booking
    name: After-hours and conflict booking
    condition: >
      A customer requests an appointment slot that conflicts with an existing
      booking OR falls outside the team's stated business hours.
    action: >
      Do not double-book or extend hours unilaterally. Offer the customer the
      three nearest available in-hours slots. If the customer insists on
      after-hours and the team supports it, route to the premium support
      queue with the team's after-hours surcharge disclosed before booking.
      If the team does not support after-hours, decline politely and surface
      the next-day first-available slot.
    rationale: >
      Silent overbooking causes overlapping appointments and burns staff.
      Hidden after-hours charges destroy trust. Both are recoverable only by
      explicit upfront communication.
    parameters:
      - name: BUSINESS_HOURS
        prompt: "What are your standard business hours? (days + start/end times)"
        default_baseline: "Mon-Fri 9:00-18:00"
        baseline_source: "Synthesized — common small-business default; adjust for your service."
        help_text: "These are the hours the agent treats as 'normal' booking windows — anything outside triggers the after-hours decision branch. Be specific by day if your weekday and weekend hours differ; the agent only knows what you tell it."
        example_answer: "Mon-Fri 9:00-18:00, Sat 10:00-15:00, closed Sun"
      - name: AFTER_HOURS_SURCHARGE
        prompt: "If you take after-hours appointments, what surcharge do you apply?"
        default_baseline: "+25% on the base service price"
        baseline_source: "Synthesized — typical service-industry premium for off-hours work."
        help_text: "The premium charged on top of the base service price for off-hours work. Disclose this to the customer BEFORE booking confirmation — surprise surcharges at invoice time are a top complaint driver and chargeback trigger in service businesses."
        example_answer: "+25% on base service price"
      - name: AFTER_HOURS_SUPPORTED
        prompt: "Do you take after-hours appointments at all? (yes / no / emergency-only)"
        default_baseline: "no"
        baseline_source: "Synthesized — most small teams decline after-hours by default to protect staff."
        help_text: "If 'no', the agent always declines and offers the next in-hours slot. If 'emergency-only', define what counts as an emergency in your team docs. 'Yes' opens after-hours but should still be combined with a surcharge so it doesn't quietly become the default."
        example_answer: "emergency-only"
    sources: []
    source_kind: synthesized
    tags: [scheduling, communication, pricing]

  - id: services.no_show_late_cancel
    name: No-show and late-cancellation fee
    condition: >
      A customer fails to arrive for a confirmed appointment OR cancels
      within the team's late-cancellation window.
    action: >
      Apply the team's no-show or late-cancellation fee per the booking terms
      the customer agreed to. Send the fee notification with the original
      booking confirmation timestamp and the policy excerpt the customer
      accepted. Offer one goodwill waiver per customer per defined period for
      first-time offenders if the team policy allows it.
    rationale: >
      No-shows cost the time slot AND opportunity cost of the customer who
      could not book. The fee disciplines the calendar; the goodwill waiver
      protects relationships with otherwise reliable customers.
    parameters:
      - name: NO_SHOW_FEE_AMOUNT
        prompt: "What's the no-show fee?"
        default_baseline: "50% of service price"
        baseline_source: "Synthesized — typical industry midpoint between full-charge and waiver."
        help_text: "A no-show is when the customer doesn't appear at all and didn't cancel. Charging 100% feels punitive on first offense; waiving entirely trains repeat misses. The 50% midpoint is the most common middle ground in appointment-based services."
        example_answer: "50% of service price"
      - name: LATE_CANCEL_WINDOW_HOURS
        prompt: "Within how many hours of the appointment is a cancellation considered 'late'?"
        default_baseline: "24 hours"
        baseline_source: "Synthesized — most service businesses use 24h as the canonical cutoff."
        help_text: "Cancellations outside this window are free; inside it, the late-cancellation fee applies. 24 hours is the canonical cutoff because it's the realistic notice period needed to refill the slot from the waitlist or rebook walk-ins."
        example_answer: "24 hours before appointment"
      - name: LATE_CANCEL_FEE_AMOUNT
        prompt: "What's the late-cancellation fee?"
        default_baseline: "25% of service price"
        baseline_source: "Synthesized — half of typical no-show fee acknowledges the customer notified you."
        help_text: "Distinct from the no-show fee — the customer at least gave you notice, so the fee is typically half of the no-show charge. Acknowledges some recovery value (chance to refill the slot) while still discouraging last-minute changes."
        example_answer: "25% of service price"
      - name: GOODWILL_WAIVER_FREQUENCY
        prompt: "How often will you waive the fee for a first-time / loyal customer?"
        default_baseline: "Once per customer per 12 months"
        baseline_source: "Synthesized — protects relationships without enabling repeat misses."
        help_text: "How often a customer can have a fee waived as goodwill. Set rare enough that loyal customers value it but not so rare that it's never used. 'Once per 12 months' is the usual balance; first-time offenders tend to be over-represented in the waiver pool."
        example_answer: "Once per customer per 12 months"
    sources: []
    source_kind: synthesized
    tags: [scheduling, finance, retention]

  - id: services.new_customer_intake
    name: New customer intake checklist
    condition: >
      A customer books their first appointment with the team, regardless of
      booking channel.
    action: >
      Before the appointment, collect the team's required intake information
      via the team's intake form (contact preferences, relevant history or
      requirements, parking or access notes for in-person services). For
      regulated services, capture required consents or waivers. Confirm the
      appointment 24-48 hours in advance via the customer's preferred channel.
    rationale: >
      First-appointment friction predicts churn. Capturing intake once,
      cleanly, prevents repeated questions and lets the service start on time.
    parameters:
      - name: INTAKE_FORM_URL
        prompt: "Where is your intake form (link or document path)?"
        default_baseline: "https://forms.example.com/intake (replace)"
        baseline_source: "Synthesized — placeholder; replace with your real form URL."
        help_text: "The exact URL or document path the agent will send to first-time customers. A 'real' URL beats a generic instruction every time — if you don't have one, build a Google Form or Typeform first; the agent can't substitute when the link doesn't exist."
        example_answer: "https://forms.example.com/intake-v2"
      - name: REQUIRED_CONSENTS
        prompt: "Are any consents or waivers required before service? (list them, or 'none')"
        default_baseline: "none"
        baseline_source: "Synthesized — most non-regulated services skip; healthcare/fitness add HIPAA/medical-history."
        help_text: "Liability waivers, medical history (fitness, healthcare), HIPAA acknowledgement (US healthcare), photo-release (salons posting before/after). If the service is regulated in your jurisdiction, the consent is legally required, not optional — list it explicitly."
        example_answer: "Liability waiver + medical-history form"
      - name: REMINDER_LEAD_TIME_HOURS
        prompt: "How many hours before the appointment do you send a reminder?"
        default_baseline: "24 hours"
        baseline_source: "Synthesized — modal lead time across appointment-based businesses."
        help_text: "The reminder window before the appointment. 24 hours is the modal cadence because it's late enough to feel timely but early enough that the customer can still cancel and free the slot. Some teams add a second reminder at 1-2 hours for high no-show services."
        example_answer: "24 hours before appointment"
      - name: PREFERRED_CHANNEL_DEFAULT
        prompt: "If a customer doesn't specify, which channel do you use to reach them? (SMS / email / call)"
        default_baseline: "SMS"
        baseline_source: "Synthesized — highest read-through for time-sensitive reminders."
        help_text: "The fallback channel when the customer hasn't expressed a preference during intake. SMS has the highest read-through for time-sensitive reminders, but local norms vary — older clientele often prefer email or phone. Always honor an explicit preference first."
        example_answer: "SMS"
    sources: []
    source_kind: synthesized
    tags: [onboarding, scheduling, compliance]

  - id: services.estimate_validity
    name: Estimate or quote validity period
    condition: >
      A customer requests work that requires a written estimate or quote
      (vs. a fixed-price service tier).
    action: >
      Provide the estimate in writing with line-item scope, total, and an
      explicit validity-until date matching the team's standard. State the
      team's policy for what triggers a re-quote (scope change, supply price
      change beyond a threshold, expiry). Require customer acknowledgement
      before scheduling the work.
    rationale: >
      Open-ended estimates strand the team when costs move. Explicit
      validity windows protect both sides and force clean re-quoting.
    parameters:
      - name: ESTIMATE_VALIDITY_DAYS
        prompt: "How many days is a written estimate valid before it expires?"
        default_baseline: "30 days"
        baseline_source: "Synthesized — long enough to plan, short enough to insulate from supply moves."
        help_text: "After this many days the estimate auto-expires and the customer needs a fresh quote. Long enough to let the customer plan and compare, short enough to insulate you from supply-cost moves between quote and work. 30 days is the modal trade-off."
        example_answer: "30 days from quote date"
      - name: SUPPLY_PRICE_VARIANCE_THRESHOLD
        prompt: "Above what supply-cost change (%) do you trigger a re-quote even within the validity window?"
        default_baseline: "10%"
        baseline_source: "Synthesized — protects margin on commodity-driven inputs."
        help_text: "Even within the validity window, a supply-cost spike beyond this percent triggers a re-quote. Protects margin on commodity-heavy work (lumber, copper, fuel surcharges). Keep the threshold transparent in the quote terms so a re-quote isn't a surprise."
        example_answer: "10% supply-cost increase"
      - name: REQUOTE_TRIGGERS
        prompt: "What other triggers force a re-quote? (e.g. scope change, site condition discovered)"
        default_baseline: "Scope change, site condition not visible at estimate, expiry"
        baseline_source: "Synthesized — covers the standard three triggers."
        help_text: "Beyond expiry and supply-cost shifts, what else justifies a re-quote? The standard three are scope change (customer added work), site conditions you couldn't see at estimate time (hidden damage, access issues), and expiry. Listing them upfront prevents disputes mid-job."
        example_answer: "Scope change, hidden site conditions, validity expiry"
    sources: []
    source_kind: synthesized
    tags: [pricing, scope, communication]

  - id: services.recurring_rebooking
    name: Recurring customer rebooking reminder
    condition: >
      A customer who completed a service has a typical rebooking interval
      based on the service type (routine cleaning, follow-up appointment,
      maintenance) AND has reached the team's reminder lead time before that
      interval.
    action: >
      Send a personalized rebooking reminder via the customer's preferred
      channel with one-click rebooking to the same provider where possible.
      Do not send if the customer opted out of marketing or has an open
      complaint. Cap reminder frequency at the team's defined maximum.
    rationale: >
      Recurring service customers are the highest-margin segment. Active
      recall prevents drift to competitors. Aggressive reminders feel like
      spam and trigger opt-outs.
    parameters:
      - name: SERVICE_REBOOKING_INTERVALS
        prompt: "What's the typical interval between repeat bookings for your services? (one value, or per service type)"
        default_baseline: "6 weeks (most personal services); adjust per service category"
        baseline_source: "Synthesized — modal salon / cleaning / personal-care interval."
        help_text: "How long between repeat appointments for a typical loyal customer. Varies sharply by category — haircut roughly 6 weeks, dental cleaning 6 months, HVAC tune-up annually. If you offer multiple service types, list the interval per category rather than a single average."
        example_answer: "6 weeks for haircut; 8 weeks for color"
      - name: REMINDER_LEAD_TIME_DAYS
        prompt: "How many days before the typical rebooking date do you send the reminder?"
        default_baseline: "7 days"
        baseline_source: "Synthesized — late enough to feel timely, early enough to schedule."
        help_text: "Days before the expected rebooking date when the reminder fires. Too early reads as marketing nag, too late and the customer has already booked elsewhere. One week ahead of the typical interval is the modal sweet spot."
        example_answer: "7 days before expected rebooking"
      - name: MAX_REMINDERS_PER_PERIOD
        prompt: "What's the maximum number of rebooking reminders you'll send in a year for one customer?"
        default_baseline: "1 per cycle, max 4 per year"
        baseline_source: "Synthesized — past 4 hits/year, opt-out rates spike."
        help_text: "Caps the spam risk on customers who don't rebook. Once per natural cycle is enough; past 4 hits per year, marketing opt-out and unsubscribe rates spike dramatically. Always honor an explicit opt-out regardless of where the count stands."
        example_answer: "1 reminder per cycle, max 4 per year"
    sources: []
    source_kind: synthesized
    tags: [retention, communication, scheduling]

  - id: services.upset_customer_tone
    name: Upset customer tone matching
    condition: >
      A customer message shows signs of frustration: explicit complaint
      language, multiple unsuccessful prior contacts, waiting longer than
      stated SLA, or escalation to public channels.
    action: >
      First reply must validate the frustration explicitly without templated
      apology language. Take ownership with a named contact ("I will
      personally handle this"). Provide a concrete next step with a specific
      time commitment matching the team's escalation SLA. Loop in a manager
      via internal note if the customer mentions cancellation or legal
      action.
    rationale: >
      Templated apologies amplify frustration. A named owner with a specific
      time commitment converts most upset customers to retained customers.
    parameters:
      - name: ESCALATION_OWNER
        prompt: "Who personally handles upset-customer escalations? (named role or person)"
        default_baseline: "Owner / lead service provider"
        baseline_source: "Synthesized — for small teams the buck stops with the owner; named contact is what de-escalates."
        help_text: "The named individual or specific role the agent will hand the escalation to. For small teams the buck usually stops with the owner — a real name is what de-escalates a frustrated customer, not 'someone from our team.' Avoid generic role labels here."
        example_answer: "Mira (Owner)"
      - name: ESCALATION_RESPONSE_SLA
        prompt: "What time commitment do you make in the first reply? (e.g. 'I'll call you within 2 hours')"
        default_baseline: "Reply within 2 hours, resolution within 1 business day"
        baseline_source: "Synthesized — concrete commitment is the de-escalation lever."
        help_text: "The specific time commitment given in the first reply (the de-escalation lever). 'I'll personally call you within 2 hours' beats 'we'll get back to you soon' every time. Pick a window your team can keep at 100% — a missed commitment makes the situation worse."
        example_answer: "Reply within 2 hours, resolution within 1 business day"
      - name: LEGAL_TRIGGER_WORDS
        prompt: "What words in the customer's message trigger an internal manager loop-in? (e.g. 'lawyer', 'sue', 'cancel')"
        default_baseline: "lawyer, attorney, sue, refund, chargeback, BBB"
        baseline_source: "Synthesized — common signals of escalation risk."
        help_text: "Keywords that flag escalation risk and silently CC a manager. Common signals include 'lawyer', 'attorney', 'sue', 'BBB' (Better Business Bureau), 'chargeback', and 'attorney general'. Any of these means the next reply has legal/regulatory consequences and shouldn't be improvised solo."
        example_answer: "lawyer, attorney, sue, BBB, chargeback"
    sources: []
    source_kind: synthesized
    tags: [communication, retention, escalation]

  - id: services.post_service_followup
    name: Post-service follow-up and review request
    condition: >
      A service appointment was completed AND the team's post-service waiting
      period has elapsed (long enough for the customer to evaluate the work
      but short enough for the experience to be fresh).
    action: >
      Send a follow-up via the customer's preferred channel asking about
      satisfaction. If the customer indicates satisfaction, surface the team's
      review request with a one-click link. If the customer indicates
      dissatisfaction, route to a service recovery owner — never request a
      public review from a dissatisfied customer.
    rationale: >
      Reviews from satisfied customers compound. Review requests sent to
      dissatisfied customers manufacture public negative reviews that the
      team would otherwise have caught privately.
    parameters:
      - name: FOLLOWUP_LAG_DAYS
        prompt: "How many days after the service do you send the follow-up?"
        default_baseline: "2 days"
        baseline_source: "Synthesized — fresh enough to recall, late enough to evaluate outcomes."
        help_text: "Days between service completion and the follow-up message. Same-day feels pushy; a week later the experience has faded. 2 days is the sweet spot — fresh enough that the customer can recall the work, late enough that they've actually used or evaluated the result."
        example_answer: "2 days after service"
      - name: REVIEW_PLATFORM_LINK
        prompt: "Where do you direct satisfied customers to leave a public review? (Google / Yelp / your site)"
        default_baseline: "Google Business Profile review link"
        baseline_source: "Synthesized — Google reviews carry highest local-search weight for service businesses."
        help_text: "The single platform where satisfied customers should be directed. Pick one — splitting reviews across platforms dilutes ranking signal. Google Business Profile reviews carry the highest local-search weight for most service businesses, but Yelp dominates in some categories (food, beauty)."
        example_answer: "Google Business Profile review link"
      - name: SERVICE_RECOVERY_OWNER
        prompt: "Who handles dissatisfied customers when follow-up surfaces a problem?"
        default_baseline: "Owner / lead service provider"
        baseline_source: "Synthesized — same owner as escalation; consistency reduces handoff drag."
        help_text: "The person who reaches out when follow-up reveals dissatisfaction (before any public review is requested). Often the same owner as the escalation contact — consistency reduces handoff drag and lets the recovery conversation reference the original service context."
        example_answer: "Mira (Owner)"
    sources: []
    source_kind: synthesized
    tags: [retention, reputation, communication]
