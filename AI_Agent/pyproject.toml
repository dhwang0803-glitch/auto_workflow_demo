[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-workflow-ai-agent"
version = "0.1.0"
description = "AI orchestration service for auto_workflow_demo — Gemma 4 via llama.cpp + personalized embeddings."
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "anthropic>=0.40",  # AnthropicBackend (migrated from API_Server)
    "pyyaml>=6",  # data/policies/*.yaml seed loading (PLAN_12 W2-3)
    "pypdf>=5",  # document_parser PDF text extraction (PLAN_12 W3-2)
    # PDF page → PNG rendering for the multimodal pivot (Phase C). Apache-2.0
    # so no license cascade onto the hackathon submission. Pillow is its
    # rendering target and is HPND-licensed.
    "pypdfium2>=4",
    "Pillow>=10",
    # PLAN_13: closed-loop self-evaluating agent. langgraph supplies the
    # StateGraph + conditional edges + reducer; langsmith supplies trace
    # capture (@traceable) consumed by the LangSmith UI. Both are off the
    # critical path when LANGCHAIN_TRACING_V2 is unset (tracing.py renders
    # @traceable a no-op), so unit tests + local dev work without an API key.
    "langgraph>=0.2,<1.0",
    "langsmith>=0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["tests*", "plans*", "scripts*", "config*"]

[tool.setuptools.package-data]
# Policy seed YAMLs ship inside the `app` package so install paths
# (Modal/Cloud-Run containers) resolve them via __file__-relative lookup.
# setuptools defaults to .py-only — without this the wheel drops the
# yaml seeds and `_seeds_by_domain()` returns an empty dict at runtime.
"app" = ["data/policies/*.yaml"]
