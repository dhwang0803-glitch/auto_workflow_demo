# Domain: nonprofit / NGO / charitable organization
# Format: see ecommerce.yaml header.
domain: nonprofit
display_name: Nonprofit / NGO
description: >
  Charitable organizations operating with donor funding, volunteer staff,
  and program beneficiaries. Common workflow surfaces: donor receipts and
  acknowledgment, donor data privacy, volunteer onboarding, restricted-fund
  handling, grant deadlines, public communication approval.
policies:
  - id: nonprofit.donor_receipt_acknowledgment
    name: Donor receipt and acknowledgment SLA
    condition: >
      A donation is received via any channel (online, check, in-kind, stock
      transfer) AND meets the team's tax-receipt threshold per the
      jurisdiction.
    action: >
      Issue a tax-compliant receipt within the team's acknowledgment SLA.
      Receipts must include the team's required jurisdiction-specific fields
      (legal name, registration ID, deductible amount, date, no-goods-received
      statement where applicable). Send a personal acknowledgment for
      donations above the team's "personal thank-you" threshold from a named
      staff member, not a template-only auto-reply.
    rationale: >
      Late receipts create tax-time complaints and tarnish donor experience.
      Personal acknowledgment for major gifts is the single highest-leverage
      donor-retention practice.
    parameters:
      - name: TAX_RECEIPT_THRESHOLD
        prompt: "Above what donation amount must you issue a tax receipt? (per your jurisdiction)"
        default_baseline: "$0 in the US (any amount can be receipted; donor needs receipt for >= $250 to claim deduction)"
        baseline_source: "Synthesized — the $250 written-acknowledgment threshold is a widely-cited US tax rule (IRS Publication 1771); confirm against current IRS guidance for your jurisdiction."
        help_text: "In the US, any donation can be receipted but the donor needs a written acknowledgment for any single contribution of $250 or more to claim the federal tax deduction (IRS Pub 1771). Other jurisdictions have their own thresholds — confirm against current local guidance, especially after tax-law changes."
        example_answer: "$0 floor (receipt all); written acknowledgment required at $250+"
      - name: ACKNOWLEDGMENT_SLA_DAYS
        prompt: "How many days after receiving a donation do you issue the receipt?"
        default_baseline: "2 business days (automated email); 14 days for non-electronic gifts"
        baseline_source: "Synthesized — donor experience standard. Legal deadline (US) is the donor's tax-filing date for the year of the gift."
        help_text: "How fast a receipt goes out after the gift lands. The legal floor in the US is the donor's own tax filing deadline for the gift year, but donor experience expects same-day or next-business-day for online gifts. Non-electronic gifts (checks, in-kind, stock) take longer to process and 14 days is reasonable."
        example_answer: "2 business days for online gifts; 14 days for checks/stock"
      - name: PERSONAL_THANKYOU_THRESHOLD
        prompt: "Above what donation amount do you send a personal (non-template) thank-you?"
        default_baseline: "$250 single gift OR $1,000 cumulative annual"
        baseline_source: "Synthesized — aligns with IRS receipt threshold and typical mid-major donor segmentation."
        help_text: "Personal thank-yous from a named staff member (not the auto-receipt) are the single highest-leverage donor-retention practice. Set the threshold low enough that mid-tier donors get the touch, high enough that the team can sustain it weekly. Aligning with the IRS $250 receipt threshold creates a natural cutoff."
        example_answer: "$250 single OR $1,000 cumulative annual"
      - name: RECEIPT_TEMPLATE
        prompt: "Where is your tax-receipt template? (must include legal name, EIN/charity number, amount, no-goods statement)"
        default_baseline: "Shared drive: development/templates/receipt_v1.docx"
        baseline_source: "Synthesized — placeholder. Required fields are jurisdiction-specific (US: see IRS Pub 1771)."
        help_text: "The receipt template must include the org's legal name, registration ID (EIN in the US, charity number elsewhere), donation amount, date, and a 'no goods or services received' statement where applicable. Missing any required field invalidates the donor's tax claim. Required fields are jurisdiction-specific — verify against current local guidance."
        example_answer: "Shared drive: development/templates/receipt_v2_2026.docx"
    sources: []
    source_kind: synthesized
    tags: [finance, retention, legal]

  - id: nonprofit.major_donor_escalation
    name: Major donor escalation
    condition: >
      A donation amount or cumulative annual giving from a single donor
      exceeds the team's major-donor threshold OR a known major donor
      contacts the team via any channel.
    action: >
      Route to the team's major-gifts officer or named senior staff member
      within the team's major-donor response SLA. Pull the donor's full
      history (gifts, prior interactions, restrictions, family/board
      connections) into the contact context. Do not handle major donor
      requests in the standard support queue.
    rationale: >
      Major donors carry disproportionate annual budget. Standard-queue
      treatment of a $50K donor question is a strategic miss the
      organization may not be able to absorb.
    parameters:
      - name: MAJOR_DONOR_THRESHOLD
        prompt: "What single-gift or cumulative-annual amount qualifies a donor as 'major' for your organization?"
        default_baseline: "$5,000 single OR $10,000 cumulative annual"
        baseline_source: "Synthesized — typical small-NPO cutoff; large foundations use much higher tiers."
        help_text: "Where the 'major donor' label kicks in. Varies sharply by org size — small community NPOs might use $5K; large university foundations might start at $25K-$100K. Set it where the top ~5% of donors fall by annual giving — high enough to be meaningful, low enough that the major-gifts queue gets steady volume."
        example_answer: "$5,000 single gift OR $10,000 cumulative annual"
      - name: MAJOR_DONOR_RESPONSE_SLA
        prompt: "How fast do you respond to a major-donor inquiry?"
        default_baseline: "Same business day"
        baseline_source: "Synthesized — major-gift officers treat these as drop-everything contacts."
        help_text: "How fast a major donor's inquiry gets a response (or at least an acknowledgment). Major-gift officers treat these as drop-everything contacts because the relationship value far exceeds any single ticket's cost. Same-day during business hours is the floor; for top-tier donors, sub-hour is the bar."
        example_answer: "Same business day; <2h for top-tier donors"
      - name: MAJOR_GIFTS_OFFICER
        prompt: "Who is your major-gifts officer (named role or person)?"
        default_baseline: "Executive Director (for small NPOs with no dedicated officer)"
        baseline_source: "Synthesized — separation only at staffing scale; below that the ED owns major-donor relationships."
        help_text: "The named role that owns major-donor relationships. For small NPOs (<$2M budget) the ED typically owns this directly because there's no dedicated officer; once development staff scales, a Director of Development or Major Gifts Officer takes over with the ED still covering top-tier."
        example_answer: "Executive Director (Maria Chen)"
    sources: []
    source_kind: synthesized
    tags: [retention, finance, communication]

  - id: nonprofit.donor_data_privacy
    name: Donor data privacy and segregation
    condition: >
      Donor contact data is being added to a mailing list, shared with a
      partner organization, used in a public communication, or processed by
      a tool outside the team's approved system.
    action: >
      Apply the team's donor-data rules: separate "do not share" donors,
      separate anonymous donors from named publication, never disclose
      individual gift amounts publicly without explicit consent. For
      partner-org sharing, confirm the partner's own data-handling matches
      the team's standard. For new tooling, run the team's vendor data-
      review checklist before sending any donor record.
    rationale: >
      Donor privacy violations destroy major-gift relationships and trigger
      regulatory exposure under GDPR, CCPA, and equivalents. Most
      violations come from convenience-driven partner sharing or unreviewed
      tool adoption, not malicious leaks.
    parameters:
      - name: DO_NOT_SHARE_FLAG_FIELD
        prompt: "Which CRM field tracks 'do not share' status on a donor?"
        default_baseline: "do_not_share boolean (or platform-equivalent custom flag)"
        baseline_source: "Synthesized — schema name is platform-specific; what matters is a single canonical flag."
        help_text: "A single canonical CRM field that the agent and team check before any data sharing. Schema name varies by platform (Salesforce, Bloomerang, DonorPerfect each have their own conventions); what matters is that there's exactly ONE flag and every workflow checks it. Multiple competing flags are how privacy violations sneak through."
        example_answer: "do_not_share boolean on Donor record"
      - name: PARTNER_SHARING_CHECKLIST
        prompt: "Where is your partner data-sharing review checklist?"
        default_baseline: "Shared drive: development/partner_data_review.md"
        baseline_source: "Synthesized — placeholder; minimum: partner's privacy policy + data handling + DPA."
        help_text: "Before sharing any donor data with a partner organization, the partner's data handling must be reviewed. Minimum: their privacy policy, their data-handling SOP, and a Data Processing Agreement (DPA) if you're a controller under GDPR. Most violations come from convenience sharing without this review."
        example_answer: "Shared drive: development/partner_data_review.md"
      - name: VENDOR_REVIEW_CHECKLIST
        prompt: "Where is your vendor data-review checklist for new tools?"
        default_baseline: "Shared drive: ops/vendor_data_review.md"
        baseline_source: "Synthesized — placeholder; check data residency, retention, sub-processors."
        help_text: "Before sending donor data to any new tool, run a vendor review. Critical points: data residency (where the data physically lives), retention (how long the vendor keeps it), sub-processors (who else they share it with), incident notification (will they tell you on breach). Skipping the review is the most common GDPR/CCPA exposure path."
        example_answer: "Shared drive: ops/vendor_data_review.md"
    sources:
      - title: "California Consumer Privacy Act (CCPA) — California Office of the Attorney General"
        url: "https://oag.ca.gov/privacy/ccpa"
    source_kind: regulatory
    tags: [legal, security, retention]

  - id: nonprofit.volunteer_onboarding
    name: Volunteer onboarding gate
    condition: >
      A new volunteer is being assigned to a role AND the role meets the
      team's defined screening level (working with vulnerable populations,
      handling money, accessing sensitive data, or unsupervised on-site
      access).
    action: >
      Do not assign to the role until the screening level's required steps
      complete: background check at the team's defined depth, reference
      checks, role-specific training, signed code-of-conduct and
      confidentiality acknowledgements. Track completion in the team's
      volunteer record system. Apply the same gate to long-tenured
      volunteers moving to a higher screening tier.
    rationale: >
      Volunteer screening failures expose beneficiaries to harm and the
      organization to liability the insurance often does not cover.
      Tenure does not substitute for the screening required by the new
      role's risk level.
    parameters:
      - name: SCREENING_LEVEL_DEFINITIONS
        prompt: "What are your screening levels? (e.g. Tier 1 = no special access; Tier 2 = $/data; Tier 3 = vulnerable populations)"
        default_baseline: "Tier 1 (general) / Tier 2 (financial or data access) / Tier 3 (working with minors or vulnerable adults)"
        baseline_source: "Synthesized tier framework — NRMC guidance recommends matching screening depth to role risk but does not prescribe a 1/2/3 tier structure."
        help_text: "Screening = the depth of vetting (background check, reference checks, training) required before a volunteer can take a role. NRMC guidance recommends matching depth to role risk; a common framework is 3 tiers: general, financial/data access, vulnerable populations. The tier structure here is illustrative — define your own tied to your roles' actual risk."
        example_answer: "Tier 1 (general) / Tier 2 (data + financial) / Tier 3 (minors or vulnerable adults)"
      - name: BACKGROUND_CHECK_VENDOR
        prompt: "Which background-check vendor do you use, and at what depth per tier?"
        default_baseline: "Vendor TBD; standard criminal for financial/data roles; enhanced (sex-offender registry, multi-state) for vulnerable-populations roles"
        baseline_source: "Synthesized depth recommendations. Verified: per the FTC's July 2011 staff report (cited in NRMC's Background Checks article), the Fair Credit Reporting Act (FCRA) applies to volunteer screening, so the vendor must be FCRA-compliant."
        help_text: "FCRA (Fair Credit Reporting Act) applies to volunteer screening in the US — the vendor must be FCRA-compliant and you must follow the consent + adverse-action notice rules per the FTC's 2011 staff report (cited in NRMC's Background Checks article). Depth scales with tier: standard criminal for data/finance; enhanced (sex-offender registry, multi-state) for vulnerable-populations roles."
        example_answer: "Sterling (FCRA-compliant); standard criminal Tier 2; enhanced multi-state Tier 3"
      - name: VOLUNTEER_RECORD_SYSTEM
        prompt: "Where do you record volunteer screening completion?"
        default_baseline: "Volunteer management platform (or shared drive: volunteers/<name>/file)"
        baseline_source: "Synthesized — must be retrievable for audit and insurance."
        help_text: "A retrievable record of screening completion per volunteer. Must be available for audit (insurance, regulatory) and for incident response. Volunteer management platforms (VolunteerMatch, Better Impact, Galaxy Digital) have this built in; smaller orgs use shared-drive folders with a consistent naming convention."
        example_answer: "Better Impact volunteer profile (screening fields)"
    sources:
      - title: "NRMC — Background Screening for Nonprofits: What to Consider"
        url: "https://nonprofitrisk.org/resources/background-screening-for-nonprofits-what-to-consider/"
    source_kind: industry-baseline
    tags: [safety, legal, onboarding]

  - id: nonprofit.restricted_fund_validation
    name: Restricted-fund spending validation
    condition: >
      A spending request draws from a restricted fund (donor-restricted gift,
      restricted grant, designated campaign) OR a coding decision must be
      made for an ambiguous expense.
    action: >
      Validate the spend against the restriction language before approval.
      For ambiguous expenses, escalate to the team's finance lead with the
      original restriction document referenced. Document the reasoning for
      the coding decision in the financial record so an audit can reconstruct
      it. Never reclassify expenses post-hoc to fit a fund balance.
    rationale: >
      Restriction violations can require donor refunds, trigger regulatory
      action, and disqualify future grants from the same source. Audit
      reconstructibility is the single biggest predictor of clean financial
      audits.
    parameters:
      - name: FINANCE_LEAD
        prompt: "Who is your finance lead (signs off on ambiguous restricted-fund spends)?"
        default_baseline: "Treasurer or Director of Finance"
        baseline_source: "Synthesized — board treasurer for small NPOs; full-time DoF at scale."
        help_text: "The named role that signs off on ambiguous restricted-fund spends. For small NPOs the board treasurer typically owns this; once revenue exceeds ~$2M, a full-time Director of Finance takes over with the treasurer still chairing the audit/finance committee. Single point of accountability — not 'the board collectively.'"
        example_answer: "Board Treasurer (Janet Wu)"
      - name: RESTRICTION_DOCUMENT_REPOSITORY
        prompt: "Where do you store the original restriction language for each restricted fund?"
        default_baseline: "Shared drive: finance/restricted_funds/<fund>/restriction_doc.pdf"
        baseline_source: "Synthesized — must be the SOURCE document, not a paraphrase."
        help_text: "The ORIGINAL restriction language as written by the donor or grantor (gift agreement, grant award letter, campaign solicitation). NOT a paraphrase or summary — under audit you must produce the source. Auditors compare actual spend against the source language; even minor paraphrase drift can constitute a restriction violation."
        example_answer: "Shared drive: finance/restricted_funds/<fund>/restriction_doc.pdf"
      - name: CODING_DECISION_LOG
        prompt: "Where do you log coding-decision reasoning for ambiguous spends?"
        default_baseline: "Shared drive: finance/coding_decisions.md (one entry per decision)"
        baseline_source: "Synthesized — auditors reconstruct from this log; minimum: expense, fund, reasoning, date, signoff."
        help_text: "When an expense's fund coding is ambiguous, the decision and reasoning must be logged contemporaneously. Auditors reconstruct restriction compliance from this log. Minimum entry: expense description, fund chosen, reasoning, date, signoff. Reconstructibility is the single biggest predictor of clean financial audits."
        example_answer: "Shared drive: finance/coding_decisions.md (one row per decision)"
    sources: []
    source_kind: synthesized
    tags: [finance, legal, compliance]

  - id: nonprofit.grant_deadline_tracking
    name: Grant deadline tracking and reminder
    condition: >
      A grant has an upcoming application, reporting, or renewal deadline
      AND the team's defined reminder lead time before the deadline has
      been reached.
    action: >
      Surface the deadline to the assigned grant lead with the deliverable
      list and the team's deadline checklist. Escalate to the executive
      lead at the team's escalation lead time if no progress signal exists.
      Track deadline-miss incidents and review them in the team's quarterly
      grants review — pattern misses indicate capacity, not memory,
      problems.
    rationale: >
      Missed grant deadlines are usually fatal — granters rarely re-open.
      The cost of a missed renewal often exceeds the cost of a full-time
      grants role; even when it does not, the loss is highly visible to the
      board.
    parameters:
      - name: GRANT_REMINDER_LEAD_DAYS
        prompt: "How many days before a grant deadline do you send the first reminder?"
        default_baseline: "30 days"
        baseline_source: "Synthesized — covers the typical grant-application drafting cycle for small NPOs."
        help_text: "Days before the grant deadline when the first reminder fires. Covers the typical drafting cycle for small NPOs (~30 days) including time to gather required documents (financials, board signatures, program data). Larger grants need 60-90 days lead; quick reports might be 14 days."
        example_answer: "30 days before deadline"
      - name: ESCALATION_LEAD_DAYS
        prompt: "If no progress signal exists, how many days before the deadline do you escalate to the executive lead?"
        default_baseline: "10 days"
        baseline_source: "Synthesized — leaves room for executive intervention without crisis-mode panic."
        help_text: "If the grant lead hasn't shown progress (drafted text, gathered documents) by this many days out, the executive lead is looped in. Leaves room for executive intervention (reassignment, expedited prep) without crisis-mode panic. Pattern misses indicate capacity, not memory, problems — review them quarterly."
        example_answer: "10 days before deadline"
      - name: GRANTS_LEAD
        prompt: "Who is your grants lead? (named role)"
        default_baseline: "Development Director, or Executive Director for small NPOs"
        baseline_source: "Synthesized — small NPOs combine; large ones separate."
        help_text: "The named role that owns grant applications and reporting. Small NPOs typically combine this with development (donor relations) under the ED or Development Director; larger NPOs separate Grants Manager from Development Director once grant volume exceeds ~10/year."
        example_answer: "Development Director (Sam Lee)"
      - name: DEADLINE_CHECKLIST
        prompt: "Where is your deadline-deliverable checklist? (per grant or generic)"
        default_baseline: "Shared drive: grants/<grant>/deadline_checklist.md"
        baseline_source: "Synthesized — minimum: required reports + financial docs + signatures. See Council on Foundations Grants Management for general guidance on grantmaker stewardship documentation."
        help_text: "Per-grant checklist of what each deadline requires — narrative report, financial report, board signatures, attachments, online portal submission. The Council on Foundations' grantmaking guides cover the typical grantmaker side; the grantee-side checklist is whatever your specific funder requires plus your internal review steps."
        example_answer: "Shared drive: grants/<grant_name>/deadline_checklist.md"
    sources:
      - title: "Council on Foundations — The Complete Guide to Grantmaking Basics: A Field Guide for Funders"
        url: "https://cof.org/content/complete-guide-grantmaking-basics-field-guide-funders"
      - title: "Council on Foundations — Grants Management"
        url: "https://cof.org/content/grants-management"
    source_kind: industry-baseline
    tags: [finance, project-mgmt, communication]

  - id: nonprofit.public_communication_approval
    name: Public communication approval for sensitive topics
    condition: >
      A planned public communication (press release, social post, public
      letter, fundraising appeal) addresses a politically sensitive topic,
      mentions a beneficiary identifiably, references a partner or
      regulator, or could be perceived as taking a partisan position.
    action: >
      Route through the team's defined approval chain (executive lead, board
      chair, or board communications committee per the topic). For
      beneficiary-identifying communications, confirm informed consent on
      file from the beneficiary. For partisan-perceived communications,
      apply the team's nonpartisan-language guideline before publication.
      Hold publication until approvals complete.
    rationale: >
      One careless public statement can lose donors across the political
      spectrum, end partnerships, or jeopardize tax-exempt status in some
      jurisdictions. The approval chain is slow on purpose.
    parameters:
      - name: APPROVAL_CHAIN
        prompt: "Who approves sensitive public comms? (one person or chain — list by topic if it varies)"
        default_baseline: "Executive Director for routine sensitive; ED + Board Chair for partisan-perceived"
        baseline_source: "Synthesized — two-step protects against single-point error on the highest-risk content."
        help_text: "The approval ladder for sensitive comms. Routine sensitive content (donor-identifying, regulator-mentioning) typically needs ED-only signoff; partisan-perceived content needs ED + Board Chair as a two-step check. Higher tiers might add the full board comms committee. The chain is slow on purpose — speed isn't the goal here."
        example_answer: "ED for routine; ED + Board Chair for partisan-perceived"
      - name: CONSENT_FILE_LOCATION
        prompt: "Where do you store informed-consent files for beneficiary-identifying communications?"
        default_baseline: "Shared drive: comms/consents/<beneficiary>.pdf"
        baseline_source: "Synthesized — must be retrievable per request; consent records are also subject access targets under GDPR/CCPA."
        help_text: "Signed informed-consent forms from beneficiaries before any identifiable mention in public comms (photos, names, stories). Must be retrievable on request — these are also subject-access targets under GDPR/CCPA right-to-access provisions. Storing them in scattered email threads is not retrievable."
        example_answer: "Shared drive: comms/consents/<beneficiary_id>.pdf"
      - name: NONPARTISAN_GUIDELINE
        prompt: "Where is your nonpartisan-language guideline? (avoid endorsing/opposing candidates, parties)"
        default_baseline: "Shared drive: comms/nonpartisan_guideline.md (US 501(c)(3) — no candidate endorsement)"
        baseline_source: "IRS § 501(c)(3) — absolute prohibition on political campaign intervention; equivalent rules apply in most jurisdictions."
        help_text: "US 501(c)(3) organizations face an ABSOLUTE prohibition on political campaign intervention — endorsing or opposing candidates can revoke tax-exempt status. Issue advocacy is generally allowed within limits; partisan campaign activity is not. Most other jurisdictions impose similar restrictions. Document the rules your team applies before staff hits 'post.'"
        example_answer: "Shared drive: comms/nonpartisan_guideline.md (501(c)(3) compliant)"
    sources:
      - title: "IRS — Restriction of political campaign intervention by Section 501(c)(3) tax-exempt organizations"
        url: "https://www.irs.gov/charities-non-profits/charitable-organizations/the-restriction-of-political-campaign-intervention-by-section-501c3-tax-exempt-organizations"
      - title: "IRS — Lobbying (501(c)(3) limits + 501(h) election)"
        url: "https://www.irs.gov/charities-non-profits/lobbying"
    source_kind: regulatory
    tags: [legal, communication, governance]
